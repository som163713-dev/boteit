name: Keep Render Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: |
          echo "🔔 Pinging Render..."
          curl -X GET "https://bot-1rcn.onrender.com/health" \
               -H "Accept: application/json" \
               --max-time 30
          
          if [ $? -eq 0 ]; then
            echo "✅ Server is alive!"
          else
            echo "❌ Connection failed"
            exit 1
          fi
