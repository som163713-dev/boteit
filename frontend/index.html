<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>هوشا</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
    <!-- محتوای اصلی (چپ) -->
    <div class="main">
        <header class="navbar">
            <div class="nav-start">
                <div class="logo" onclick="goHome()">
                    <div class="logo-mark">◆</div>
                    <span class="logo-text">هوشا</span>
                </div>
                <nav class="top-tools">
                    <button class="t-tool" title="خانه" onclick="goHome()">🏠</button>
                    <button class="t-tool" title="موزیک" onclick="toast('ساخت موزیک — به‌زودی')">🎵</button>
                    <button class="t-tool" title="ویدیو" onclick="toast('ساخت ویدیو — به‌زودی')">🎬</button>
                    <button class="t-tool" title="تصویر" onclick="toast('ساخت عکس — به‌زودی')">🖼️</button>
                    <button class="t-tool" title="دستیار" onclick="selectCategory('general','دستیار')">🤖</button>
                </nav>
            </div>
            <div class="nav-end">
                <button class="model-chip" id="model-chip" onclick="toggleModels()">
                    <span class="model-ico">◈</span>
                    <span id="model-label">Gemini 3.6</span>
                    <span class="chev">▾</span>
                </button>
                <button class="t-tool" title="گفتگو" onclick="focusComposer()">💬</button>
                <button class="avatar-btn mobile-only" onclick="toggleSidebar()" title="منو">ا</button>
            </div>
        </header>

        <div class="banner" id="banner">
            <span>✨ قوی‌ترین مدل تولید محتوا در یک پلتفرم — گفتگو را شروع کنید</span>
            <button class="banner-x" onclick="this.parentElement.remove()">×</button>
        </div>

        <div class="workspace" id="workspace">
            <div id="empty-state" class="empty-state">
                <h1 class="hero-title">چی می‌خوای برات انجام بدم؟</h1>
                <div class="feature-pills">
                    <button class="fpill" onclick="toast('ابزارها — به‌زودی')"><span>🧰</span>ابزارها</button>
                    <button class="fpill" onclick="toast('ساخت عکس — به‌زودی')"><span>🖼️</span>ساخت عکس</button>
                    <button class="fpill" onclick="toast('ساخت ویدیو — به‌زودی')"><span>🎬</span>ساخت ویدیو</button>
                    <button class="fpill" onclick="toast('ساخت موزیک — به‌زودی')"><span>🎵</span>ساخت موزیک</button>
                    <button class="fpill" onclick="selectCategory('general','دستیارها')"><span>🟢</span>دستیارها</button>
                    <button class="fpill" onclick="toast('صداگذاری — به‌زودی')"><span>🎙️</span>صداگذاری و دوبله</button>
                </div>
            </div>
            <div id="messages" class="messages-box hidden"></div>
        </div>

        <div class="composer-wrap">
            <div class="composer">
                <textarea id="user-input" rows="1" placeholder="هرچی می‌خوای بپرس!" onkeydown="onEnter(event)" oninput="autoGrow(this)"></textarea>
                <div class="composer-bottom">
                    <div class="composer-actions">
                        <button class="c-btn send" id="send-btn" onclick="sendMessage()">↑</button>
                        <button class="c-btn" onclick="toast('پیوست — به‌زودی')">📎</button>
                        <button class="c-btn" onclick="toast('صدا — به‌زودی')">🎤</button>
                        <label class="deep-toggle">
                            <input type="checkbox" id="deep-think">
                            <span class="toggle-ui"></span>
                            <span class="toggle-label">تفکر عمیق</span>
                        </label>
                    </div>
                    <div class="composer-hint">هوش مصنوعی ممکن است اشتباه کند</div>
                </div>
            </div>
        </div>
    </div>

    <!-- سایدبار سمت راست -->
    <aside class="sidebar-shell" id="sidebar-shell">
        <!-- حالت جمع‌شده: نوار باریک آیکون -->
        <div class="mini-rail" id="mini-rail">
            <button class="mini-btn expand" onclick="expandSidebar()" title="باز کردن منو">‹</button>
            <button class="mini-btn" onclick="expandSidebar(); goHome()" title="گفتگو">💬</button>
            <button class="mini-btn" onclick="expandSidebar()" title="مدل‌ها">✨</button>
            <button class="mini-btn" onclick="toast('تصویر')" title="تصویر">🖼️</button>
            <button class="mini-btn" onclick="toast('ویدیو')" title="ویدیو">🎬</button>
            <button class="mini-btn" onclick="toast('موزیک')" title="موزیک">🎵</button>
            <button class="mini-btn" onclick="selectCategory('general','دستیار')" title="دستیار">🤖</button>
            <div class="mini-spacer"></div>
            <button class="mini-btn" onclick="expandSidebar()" title="تنظیمات">⚙️</button>
            <button class="mini-avatar" onclick="expandSidebar()">ا</button>
        </div>

        <!-- حالت باز: کارت کامل -->
        <div class="sidebar-card" id="sidebar-card">
            <button class="collapse-arrow" onclick="collapseSidebar()" title="جمع کردن">›</button>

            <div class="sidebar-user">
                <div class="avatar">ا</div>
                <div class="user-meta">
                    <div class="user-name">کاربر هوشا</div>
                    <div class="user-sub">ورود به حساب کاربری</div>
                </div>
            </div>

            <div class="side-scroll">
                <button class="side-item active" onclick="goHome()"><span class="si">💬</span><span>گفتگو</span></button>
                <button class="side-item" onclick="toggleModels()"><span class="si">✨</span><span>مدل‌ها</span></button>
                <button class="side-item" onclick="toast('تاریخچه به‌زودی')"><span class="si">🕐</span><span>تاریخچه گفتگوها</span></button>

                <div class="side-label">سرویس‌های اصلی</div>
                <div class="side-grid">
                    <button class="side-tile" onclick="toast('تصویر')"><span>🖼️</span>تصویر</button>
                    <button class="side-tile" onclick="toast('ویدیو')"><span>🎬</span>ویدیو</button>
                    <button class="side-tile" onclick="toast('گالری')"><span>🧩</span>گالری</button>
                    <button class="side-tile" onclick="toast('موزیک')"><span>🎵</span>موزیک</button>
                </div>

                <div class="side-label">دستیارهای تخصصی</div>
                <button class="side-item" onclick="selectCategory('shopping','فروشگاه')"><span class="si">🛍️</span><span>فروشگاه</span></button>
                <button class="side-item" onclick="selectCategory('clinic','کلینیک')"><span class="si">🏥</span><span>کلینیک</span></button>
                <button class="side-item" onclick="selectCategory('realestate','املاک')"><span class="si">🏠</span><span>املاک</span></button>
                <button class="side-item" onclick="selectCategory('education','آموزش')"><span class="si">📚</span><span>آموزش</span></button>
                <button class="side-item" onclick="selectCategory('restaurant','رستوران')"><span class="si">🍕</span><span>رستوران</span></button>
                <button class="side-item" onclick="selectCategory('legal','حقوقی')"><span class="si">⚖️</span><span>حقوقی</span></button>
                <button class="side-item" onclick="selectCategory('finance','مالی')"><span class="si">💰</span><span>مالی</span></button>
                <button class="side-item" onclick="selectCategory('support','پشتیبانی')"><span class="si">🔧</span><span>پشتیبانی</span></button>
                <button class="side-item" onclick="selectCategory('general','دستیار عمومی')"><span class="si">🤖</span><span>دستیار عمومی</span></button>

                <div class="side-label">سایر</div>
                <button class="side-item" onclick="toast('ابزارها')"><span class="si">🧰</span><span>ابزارها</span></button>
                <button class="side-item" onclick="toast('صداگذاری')"><span class="si">🎙️</span><span>صداگذاری و دوبله</span><span class="badge">جدید</span></button>
                <button class="side-item" onclick="toast('تنظیمات')"><span class="si">⚙️</span><span>تنظیمات</span></button>
            </div>
        </div>
    </aside>
</div>

<div class="model-menu hidden" id="model-menu">
    <button onclick="pickModel('Gemini 3.6')">Gemini 3.6</button>
    <button onclick="pickModel('دستیار عمومی')">دستیار عمومی</button>
    <button onclick="pickModel('پشتیبانی فنی')">پشتیبانی فنی</button>
</div>
<div class="toast hidden" id="toast"></div>
<div class="sidebar-backdrop hidden" id="backdrop" onclick="collapseSidebar()"></div>

<script src="/static/app.js"></script>
</body>
</html>
