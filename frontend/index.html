<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>هوشا</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
    <!-- محتوای اصلی -->
    <div class="main">
        <!-- نوار بالا مثل هوشا -->
        <header class="navbar">
            <div class="nav-start">
                <div class="logo" onclick="goHome()">
                    <div class="logo-mark">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                            <path d="M12 2L4 7v10l8 5 8-5V7l-8-5z" fill="currentColor" opacity=".95"/>
                            <path d="M12 8l-3 2v4l3 2 3-2v-4l-3-2z" fill="#fff" opacity=".9"/>
                        </svg>
                    </div>
                    <span class="logo-text">هوشا</span>
                </div>

                <!-- ابزارهای بالای بنر (مثل هوشا) -->
                <nav class="top-tools">
                    <button class="t-tool" title="خانه" onclick="goHome()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5z"/></svg>
                    </button>
                    <button class="t-tool" title="موزیک" onclick="toast('ساخت موزیک — به‌زودی')">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                    </button>
                    <button class="t-tool" title="ویدیو" onclick="toast('ساخت ویدیو — به‌زودی')">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="14" height="14" rx="2"/><path d="M17 10l4-2v8l-4-2V10z"/></svg>
                    </button>
                    <button class="t-tool" title="تصویر" onclick="toast('ساخت عکس — به‌زودی')">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M3 16l5-4 4 3 4-5 5 6"/></svg>
                    </button>
                    <button class="t-tool" title="دستیار" onclick="selectCategory('general','دستیار')">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="7" width="14" height="12" rx="3"/><circle cx="9" cy="12" r="1.2" fill="currentColor"/><circle cx="15" cy="12" r="1.2" fill="currentColor"/><path d="M9 16h6"/></svg>
                    </button>
                </nav>
            </div>

            <div class="nav-end">
                <button class="model-chip" id="model-chip" onclick="toggleModels()">
                    <span class="model-ico">◈</span>
                    <span id="model-label">Gemini 3.6</span>
                    <span class="chev">▾</span>
                </button>
                <button class="t-tool chat-tool" title="گفتگو" onclick="focusComposer()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H10l-4 3v-3H7a3 3 0 0 1-3-3V6z"/></svg>
                </button>
                <button class="avatar-btn" onclick="toggleSidebar()" title="منو">
                    <span>ا</span>
                </button>
            </div>
        </header>

        <!-- بنر -->
        <div class="banner" id="banner">
            <span>✨ قوی‌ترین مدل تولید محتوا در یک پلتفرم — گفتگو را شروع کنید</span>
            <button class="banner-x" onclick="this.parentElement.remove()">×</button>
        </div>

        <!-- فضای کار -->
        <div class="workspace" id="workspace">
            <div id="empty-state" class="empty-state">
                <h1 class="hero-title">چی می‌خوای برات انجام بدم؟</h1>

                <div class="feature-pills">
                    <button class="fpill" onclick="toast('ابزارها — به‌زودی')"><span class="fi">🧰</span>ابزارها</button>
                    <button class="fpill" onclick="toast('ساخت عکس — به‌زودی')"><span class="fi">🖼️</span>ساخت عکس</button>
                    <button class="fpill" onclick="toast('ساخت ویدیو — به‌زودی')"><span class="fi">🎬</span>ساخت ویدیو</button>
                    <button class="fpill" onclick="toast('ساخت موزیک — به‌زودی')"><span class="fi">🎵</span>ساخت موزیک</button>
                    <button class="fpill" onclick="selectCategory('general','دستیارها')"><span class="fi">🟢</span>دستیارها</button>
                    <button class="fpill" onclick="toast('صداگذاری — به‌زودی')"><span class="fi">🎙️</span>صداگذاری و دوبله</button>
                </div>
            </div>

            <div id="messages" class="messages-box hidden"></div>
        </div>

        <!-- ورودی -->
        <div class="composer-wrap">
            <div class="composer">
                <textarea id="user-input" rows="1" placeholder="هرچی می‌خوای بپرس!" onkeydown="onEnter(event)" oninput="autoGrow(this)"></textarea>
                <div class="composer-bottom">
                    <div class="composer-actions">
                        <button class="c-btn send" id="send-btn" onclick="sendMessage()" title="ارسال">↑</button>
                        <button class="c-btn" onclick="toast('پیوست — به‌زودی')" title="پیوست">📎</button>
                        <button class="c-btn" onclick="toast('صدا — به‌زودی')" title="صدا">🎤</button>
                        <label class="deep-toggle">
                            <input type="checkbox" id="deep-think">
                            <span class="toggle-ui"></span>
                            <span class="toggle-label">تفکر عمیق</span>
                        </label>
                    </div>
                    <div class="composer-hint">هوش مصنوعی ممکن است اشتباه کند</div>
                </div>
            </div>
        </div>
    </div>

    <!-- سایدبار کارتی جمع‌شونده سمت راست -->
    <aside class="sidebar-shell" id="sidebar-shell">
        <button class="collapse-btn" id="collapse-btn" onclick="toggleSidebar()" title="جمع/باز">
            <svg id="collapse-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg>
        </button>

        <div class="sidebar-card" id="sidebar">
            <div class="sidebar-user">
                <div class="avatar">ا</div>
                <div class="user-meta">
                    <div class="user-name">کاربر هوشا</div>
                    <div class="user-sub">ورود به حساب کاربری</div>
                </div>
            </div>

            <div class="side-scroll">
                <button class="side-item active" onclick="goHome(); closeSidebarMobile()">
                    <span class="si">💬</span><span>گفتگو</span>
                </button>
                <button class="side-item" onclick="toggleModels(); closeSidebarMobile()">
                    <span class="si">✨</span><span>مدل‌ها</span>
                </button>
                <button class="side-item" onclick="toast('تاریخچه به‌زودی'); closeSidebarMobile()">
                    <span class="si">🕐</span><span>تاریخچه گفتگوها</span>
                </button>

                <div class="side-label">سرویس‌های اصلی</div>
                <div class="side-grid">
                    <button class="side-tile" onclick="toast('تصویر — به‌زودی')"><span>🖼️</span>تصویر</button>
                    <button class="side-tile" onclick="toast('ویدیو — به‌زودی')"><span>🎬</span>ویدیو</button>
                    <button class="side-tile" onclick="toast('گالری — به‌زودی')"><span>🧩</span>گالری</button>
                    <button class="side-tile" onclick="toast('موزیک — به‌زودی')"><span>🎵</span>موزیک</button>
                </div>

                <div class="side-label">دستیارهای تخصصی</div>
                <button class="side-item" onclick="selectCategory('shopping','فروشگاه')"><span class="si">🛍️</span><span>فروشگاه</span></button>
                <button class="side-item" onclick="selectCategory('clinic','کلینیک')"><span class="si">🏥</span><span>کلینیک</span></button>
                <button class="side-item" onclick="selectCategory('realestate','املاک')"><span class="si">🏠</span><span>املاک</span></button>
                <button class="side-item" onclick="selectCategory('education','آموزش')"><span class="si">📚</span><span>آموزش</span></button>
                <button class="side-item" onclick="selectCategory('restaurant','رستوران')"><span class="si">🍕</span><span>رستوران</span></button>
                <button class="side-item" onclick="selectCategory('legal','حقوقی')"><span class="si">⚖️</span><span>حقوقی</span></button>
                <button class="side-item" onclick="selectCategory('finance','مالی')"><span class="si">💰</span><span>مالی</span></button>
                <button class="side-item" onclick="selectCategory('support','پشتیبانی')"><span class="si">🔧</span><span>پشتیبانی</span></button>
                <button class="side-item" onclick="selectCategory('general','دستیار عمومی')"><span class="si">🤖</span><span>دستیار عمومی</span></button>

                <div class="side-label">سایر امکانات</div>
                <button class="side-item" onclick="toast('ابزارها — به‌زودی')"><span class="si">🧰</span><span>ابزارها</span></button>
                <button class="side-item" onclick="toast('صداگذاری — به‌زودی')"><span class="si">🎙️</span><span>صداگذاری و دوبله</span><span class="badge">جدید</span></button>
                <button class="side-item" onclick="toast('تنظیمات')"><span class="si">⚙️</span><span>تنظیمات</span></button>
            </div>
        </div>
    </aside>
</div>

<div class="model-menu hidden" id="model-menu">
    <button onclick="pickModel('Gemini 3.6')">Gemini 3.6</button>
    <button onclick="pickModel('دستیار عمومی')">دستیار عمومی</button>
    <button onclick="pickModel('پشتیبانی فنی')">پشتیبانی فنی</button>
</div>
<div class="toast hidden" id="toast"></div>
<div class="sidebar-backdrop hidden" id="backdrop" onclick="closeSidebarMobile()"></div>

<script src="/static/app.js"></script>
</body>
</html>
