<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>آشا</title>
  <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app-wrap">

  <!-- ══ Rail سمت راست ══ -->
  <aside class="rail" id="rail">

    <!-- برند -->
    <div class="rail-brand" onclick="goHome()">
      <div class="rail-logo-mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L3 7v10l9 5 9-5V7l-9-5z" fill="currentColor"/>
          <path d="M12 7.5l-4 2.5v5l4 2.5 4-2.5v-5l-4-2.5z" fill="#fff" opacity=".9"/>
        </svg>
      </div>
      <span class="rail-brand-text">آشا</span>
    </div>

    <div class="rail-sep"></div>

    <!-- ناوبری ثابت -->
    <button class="rail-item active" id="rail-home" onclick="goHome()">
      <div class="rail-item-ico">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M4 6a3 3 0 013-3h10a3 3 0 013 3v8a3 3 0 01-3 3H10l-4 3v-3H7a3 3 0 01-3-3V6z"/>
        </svg>
      </div>
      <span class="rail-item-label">گفتگو</span>
    </button>

    <button class="rail-item" onclick="toast('ساخت ویدیو — به‌زودی')">
      <div class="rail-item-ico">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="5" width="14" height="14" rx="2"/>
          <path d="M17 10l4-2v8l-4-2V10z"/>
        </svg>
      </div>
      <span class="rail-item-label">ساخت ویدیو</span>
    </button>

    <button class="rail-item" onclick="toast('ساخت عکس — به‌زودی')">
      <div class="rail-item-ico">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="4" width="18" height="16" rx="2"/>
          <circle cx="9" cy="10" r="2"/>
          <path d="M3 16l5-4 4 3 4-5 5 6"/>
        </svg>
      </div>
      <span class="rail-item-label">ساخت تصویر</span>
    </button>

    <button class="rail-item" onclick="toast('ساخت موزیک — به‌زودی')">
      <div class="rail-item-ico">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/>
          <circle cx="18" cy="16" r="3"/>
        </svg>
      </div>
      <span class="rail-item-label">ساخت موزیک</span>
    </button>

    <button class="rail-item" onclick="toast('گالری — به‌زودی')">
      <div class="rail-item-ico">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/>
          <rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
      </div>
      <span class="rail-item-label">گالری</span>
    </button>

    <div class="rail-sep"></div>

    <!-- اسکرول - دستیارها -->
    <div class="rail-scroll">
      <div class="rail-group-label">دستیارهای تخصصی</div>

      <button class="rail-item" onclick="selectCategory('shopping','فروشگاه')">
        <div class="rail-item-ico">🛍️</div>
        <span class="rail-item-label">فروشگاه</span>
      </button>
      <button class="rail-item" onclick="selectCategory('clinic','کلینیک')">
        <div class="rail-item-ico">🏥</div>
        <span class="rail-item-label">کلینیک</span>
      </button>
      <button class="rail-item" onclick="selectCategory('realestate','املاک')">
        <div class="rail-item-ico">🏠</div>
        <span class="rail-item-label">املاک</span>
      </button>
      <button class="rail-item" onclick="selectCategory('education','آموزش')">
        <div class="rail-item-ico">📚</div>
        <span class="rail-item-label">آموزش</span>
      </button>
      <button class="rail-item" onclick="selectCategory('restaurant','رستوران')">
        <div class="rail-item-ico">🍕</div>
        <span class="rail-item-label">رستوران</span>
      </button>
      <button class="rail-item" onclick="selectCategory('legal','حقوقی')">
        <div class="rail-item-ico">⚖️</div>
        <span class="rail-item-label">حقوقی</span>
      </button>
      <button class="rail-item" onclick="selectCategory('finance','مالی')">
        <div class="rail-item-ico">💰</div>
        <span class="rail-item-label">مالی</span>
      </button>
      <button class="rail-item" onclick="selectCategory('support','پشتیبانی')">
        <div class="rail-item-ico">🔧</div>
        <span class="rail-item-label">پشتیبانی</span>
      </button>
      <button class="rail-item" onclick="selectCategory('general','دستیار عمومی')">
        <div class="rail-item-ico">🤖</div>
        <span class="rail-item-label">دستیار عمومی</span>
      </button>

      <div class="rail-group-label">سایر</div>
      <button class="rail-item" onclick="toast('ابزارها — به‌زودی')">
        <div class="rail-item-ico">🧰</div>
        <span class="rail-item-label">ابزارها</span>
      </button>
      <button class="rail-item" onclick="toast('صداگذاری — به‌زودی')">
        <div class="rail-item-ico">🎙️</div>
        <span class="rail-item-label">صداگذاری و دوبله</span>
        <span class="rail-item-badge">جدید</span>
      </button>
      <button class="rail-item" onclick="toast('تنظیمات')">
        <div class="rail-item-ico">⚙️</div>
        <span class="rail-item-label">تنظیمات</span>
      </button>
    </div>

    <!-- فوتر -->
    <div class="rail-footer">
      <button class="rail-toggle" onclick="toggleRail()">
        <div class="rail-toggle-ico">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M9 6l6 6-6 6"/>
          </svg>
        </div>
        <span class="rail-toggle-label">جمع کردن</span>
      </button>

      <div class="rail-user">
        <div class="rail-avatar">ا</div>
        <div class="rail-user-info">
          <div class="rail-user-name">کاربر آشا</div>
          <div class="rail-user-sub">ورود به حساب</div>
        </div>
      </div>
    </div>

  </aside>

  <!-- ══ صفحه اصلی ══ -->
  <div class="page">

    <header class="navbar">
      <div class="nav-right">
        <div class="logo" onclick="goHome()">
          <div class="logo-mark">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M12 2L3 7v10l9 5 9-5V7l-9-5z" fill="currentColor"/>
              <path d="M12 7.5l-4 2.5v5l4 2.5 4-2.5v-5l-4-2.5z" fill="#fff" opacity=".9"/>
            </svg>
          </div>
          <span class="logo-text">آشا</span>
        </div>
      </div>

      <!-- وسط هدر -->
      <nav class="top-tools">
        <button class="t-tool" title="خانه" onclick="goHome()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 01-1 1h-5v-6H10v6H5a1 1 0 01-1-1v-9.5z"/></svg>
        </button>
        <button class="t-tool" title="موزیک" onclick="toast('ساخت موزیک — به‌زودی')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </button>
        <button class="t-tool" title="ویدیو" onclick="toast('ساخت ویدیو — به‌زودی')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="14" height="14" rx="2"/><path d="M17 10l4-2v8l-4-2V10z"/></svg>
        </button>
        <button class="t-tool" title="تصویر" onclick="toast('ساخت عکس — به‌زودی')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M3 16l5-4 4 3 4-5 5 6"/></svg>
        </button>
        <button class="t-tool" title="دستیار" onclick="selectCategory('general','دستیار')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="7" width="14" height="12" rx="3"/><circle cx="9" cy="12" r="1.3" fill="currentColor"/><circle cx="15" cy="12" r="1.3" fill="currentColor"/><path d="M9 16h6"/></svg>
        </button>
      </nav>

      <div class="nav-left">
        <button class="model-chip" id="model-chip" onclick="toggleModels()">
          <span class="model-ico">◈</span>
          <span id="model-label">Gemini 3.6</span>
          <span class="chev">▾</span>
        </button>
        <button class="t-tool" onclick="focusComposer()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6a3 3 0 013-3h10a3 3 0 013 3v8a3 3 0 01-3 3H10l-4 3v-3H7a3 3 0 01-3-3V6z"/></svg>
        </button>
        <button class="avatar-btn" onclick="toast('پروفایل')">ا</button>
      </div>
    </header>

    <div class="banner" id="banner">
      <span>✨ قوی‌ترین مدل‌های هوش مصنوعی در یک پلتفرم — گفتگو را شروع کنید</span>
      <button class="banner-x" onclick="this.parentElement.remove()">×</button>
    </div>

    <main class="workspace">
      <div id="empty-state" class="empty-state">
        <h1 class="hero-title">چی می‌خوای برات انجام بدم؟</h1>
        <div class="feature-pills">
          <button class="fpill" onclick="toast('ابزارها — به‌زودی')"><span>🧰</span>ابزارها</button>
          <button class="fpill" onclick="toast('ساخت عکس — به‌زودی')"><span>🖼️</span>ساخت عکس</button>
          <button class="fpill" onclick="toast('ساخت ویدیو — به‌زودی')"><span>🎬</span>ساخت ویدیو</button>
          <button class="fpill" onclick="toast('ساخت موزیک — به‌زودی')"><span>🎵</span>ساخت موزیک</button>
          <button class="fpill" onclick="selectCategory('general','دستیارها')"><span>🟢</span>دستیارها</button>
          <button class="fpill" onclick="toast('صداگذاری — به‌زودی')"><span>🎙️</span>صداگذاری و دوبله</button>
        </div>
      </div>
      <div id="messages" class="messages-box hidden"></div>
    </main>

    <div class="composer-wrap">
      <div class="composer">
        <textarea id="user-input" rows="1" placeholder="هرچی می‌خوای بپرس!" onkeydown="onEnter(event)" oninput="autoGrow(this)"></textarea>
        <div class="composer-bottom">
          <div class="composer-actions">
            <button class="c-btn send" id="send-btn" onclick="sendMessage()">↑</button>
            <button class="c-btn" onclick="toast('پیوست — به‌زودی')">📎</button>
            <button class="c-btn" onclick="toast('صدا — به‌زودی')">🎤</button>
            <label class="deep-toggle">
              <input type="checkbox" id="deep-think">
              <span class="toggle-ui"></span>
              <span class="toggle-label">تفکر عمیق</span>
            </label>
          </div>
          <div class="composer-hint">هوش مصنوعی ممکن است اشتباه کند</div>
        </div>
      </div>
    </div>

  </div><!-- /page -->
</div><!-- /app-wrap -->

<div class="model-menu hidden" id="model-menu">
  <button onclick="pickModel('Gemini 3.6')">Gemini 3.6</button>
  <button onclick="pickModel('دستیار عمومی')">دستیار عمومی</button>
  <button onclick="pickModel('پشتیبانی فنی')">پشتیبانی فنی</button>
</div>
<div class="toast hidden" id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
