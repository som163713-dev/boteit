<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>آشا</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- دکمه باز کردن rail وقتی جمعه -->
<button class="rail-open-btn hidden" id="rail-open-btn" onclick="toggleRail()">
    <svg id="rail-arrow" width="16" height="16" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2.4">
        <path d="M15 6l-6 6 6 6"/>
    </svg>
</button>

<div class="page">
    <!-- هدر -->
    <header class="navbar">
        <div class="nav-right">
            <div class="logo" onclick="goHome()">
                <div class="logo-mark">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <path d="M12 2L3 7v10l9 5 9-5V7l-9-5z" fill="currentColor"/>
                        <path d="M12 7.5l-4 2.5v5l4 2.5 4-2.5v-5l-4-2.5z" fill="#fff" opacity=".9"/>
                    </svg>
                </div>
                <span class="logo-text">آشا</span>
            </div>
        </div>

        <div class="nav-center">
            <div class="top-tools">
                <button class="t-tool" title="خانه" onclick="goHome()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 01-1 1h-5v-6H10v6H5a1 1 0 01-1-1v-9.5z"/></svg>
                </button>
                <button class="t-tool" title="موزیک" onclick="toast('ساخت موزیک — به‌زودی')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                </button>
                <button class="t-tool" title="ویدیو" onclick="toast('ساخت ویدیو — به‌زودی')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="14" height="14" rx="2"/><path d="M17 10l4-2v8l-4-2V10z"/></svg>
                </button>
                <button class="t-tool" title="تصویر" onclick="toast('ساخت عکس — به‌زودی')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M3 16l5-4 4 3 4-5 5 6"/></svg>
                </button>
                <button class="t-tool" title="دستیار" onclick="selectCategory('general','دستیار')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="7" width="14" height="12" rx="3"/><circle cx="9" cy="12" r="1.3" fill="currentColor"/><circle cx="15" cy="12" r="1.3" fill="currentColor"/><path d="M9 16h6"/></svg>
                </button>
                <span class="tools-divider"></span>
                <button class="model-chip" id="model-chip" onclick="toggleModels()">
                    <span class="model-ico">◈</span>
                    <span id="model-label">Gemini 3.6</span>
                    <span class="chev">▾</span>
                </button>
            </div>
            <button class="new-chat-btn" title="گفتگوی جدید" onclick="goHome()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
            </button>
        </div>

        <div class="nav-left">
            <button class="avatar-btn" onclick="openPanel()" title="منو">ا</button>
        </div>
    </header>

    <!-- بنر -->
    <div class="banner" id="banner">
        <span>✨ قوی‌ترین مدل‌های هوش مصنوعی در یک پلتفرم — گفتگو را شروع کنید</span>
        <button class="banner-x" onclick="this.parentElement.remove()">×</button>
    </div>

    <!-- محتوای مرکزی -->
    <main class="workspace" id="workspace">
        <div id="empty-state" class="empty-state">
            <h1 class="hero-title">چی می‌خوای برات انجام بدم؟</h1>
            <div class="feature-pills">
                <button class="fpill" onclick="toast('ابزارها — به‌زودی')"><span>🧰</span>ابزارها</button>
                <button class="fpill" onclick="toast('ساخت عکس — به‌زودی')"><span>🖼️</span>ساخت عکس</button>
                <button class="fpill" onclick="toast('ساخت ویدیو — به‌زودی')"><span>🎬</span>ساخت ویدیو</button>
                <button class="fpill" onclick="toast('ساخت موزیک — به‌زودی')"><span>🎵</span>ساخت موزیک</button>
                <button class="fpill" onclick="selectCategory('general','دستیارها')"><span>🟢</span>دستیارها</button>
                <button class="fpill" onclick="toast('صداگذاری — به‌زودی')"><span>🎙️</span>صداگذاری و دوبله</button>
            </div>
        </div>
        <div id="messages" class="messages-box hidden"></div>
    </main>

    <!-- ورودی -->
    <div class="composer-wrap">
        <div class="composer">
            <textarea id="user-input" rows="1" placeholder="هرچی می‌خوای بپرس!" onkeydown="onEnter(event)" oninput="autoGrow(this)"></textarea>
            <div class="composer-bottom">
                <div class="composer-actions">
                    <button class="c-btn send" id="send-btn" onclick="sendMessage()">↑</button>
                    <button class="c-btn" onclick="toast('پیوست — به‌زودی')">📎</button>
                    <button class="c-btn" onclick="toast('صدا — به‌زودی')">🎤</button>
                    <label class="deep-toggle">
                        <input type="checkbox" id="deep-think">
                        <span class="toggle-ui"></span>
                        <span class="toggle-label">تفکر عمیق</span>
                    </label>
                </div>
                <div class="composer-hint">هوش مصنوعی ممکن است اشتباه کند</div>
            </div>
        </div>
    </div>
</div>

<!-- نوار آیکون ثابت سمت راست -->
<aside class="right-rail" id="right-rail">
    <button class="rail-ico" onclick="openPanel()" title="منو">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <button class="rail-ico active" onclick="goHome()" title="گفتگو">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6a3 3 0 013-3h10a3 3 0 013 3v8a3 3 0 01-3 3H10l-4 3v-3H7a3 3 0 01-3-3V6z"/></svg>
    </button>
    <button class="rail-ico" onclick="openPanel()" title="مدل‌ها">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l2.2 4.5L19 8.2l-3.5 3.4.8 4.9L12 14.2 7.7 16.5l.8-4.9L5 8.2l4.8-.7L12 3z"/></svg>
    </button>
    <button class="rail-ico" onclick="toast('ساخت ویدیو')" title="ویدیو">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="14" height="14" rx="2"/><path d="M17 10l4-2v8l-4-2V10z"/></svg>
    </button>
    <button class="rail-ico" onclick="toast('ساخت عکس')" title="تصویر">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M3 16l5-4 4 3 4-5 5 6"/></svg>
    </button>
    <button class="rail-ico" onclick="toast('موزیک')" title="موزیک">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    </button>
    <button class="rail-ico" onclick="toast('گالری')" title="گالری">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h6v6H4zM14 6h6v4h-6zM14 14h6v4h-6zM4 16h6v2H4z"/></svg>
    </button>
    <div class="rail-gap"></div>
    <button class="rail-ico dark" onclick="openPanel()" title="بیشتر">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4 14h7l-1 8 10-14h-7l1-6z"/></svg>
    </button>
    <button class="rail-ico" onclick="toast('تنظیمات')" title="تنظیمات">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button class="rail-collapse" onclick="toggleRail()" title="جمع/باز نوار">
        <svg id="rail-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
            <path d="M15 6l-6 6 6 6"/>
        </svg>
    </button>
</aside>

<!-- پنل کارت روی صفحه -->
<div class="panel-backdrop hidden" id="backdrop" onclick="closePanel()"></div>
<aside class="side-panel" id="side-panel">
    <div class="panel-card">
        <button class="panel-close" onclick="closePanel()" title="بستن">›</button>

        <div class="panel-user">
            <div class="avatar">ا</div>
            <div>
                <div class="user-name">کاربر آشا</div>
                <div class="user-sub">ورود به حساب کاربری</div>
            </div>
        </div>

        <div class="panel-scroll">
            <button class="side-item active" onclick="goHome(); closePanel()"><span class="si">💬</span>گفتگو</button>
            <button class="side-item" onclick="toggleModels()"><span class="si">✨</span>مدل‌ها</button>
            <button class="side-item" onclick="toast('تاریخچه')"><span class="si">🕐</span>تاریخچه گفتگوها</button>

            <div class="side-label">سرویس‌های اصلی</div>
            <div class="side-grid">
                <button class="side-tile" onclick="toast('تصویر')"><span>🖼️</span>تصویر</button>
                <button class="side-tile" onclick="toast('ویدیو')"><span>🎬</span>ویدیو</button>
                <button class="side-tile" onclick="toast('گالری')"><span>🧩</span>گالری</button>
                <button class="side-tile" onclick="toast('موزیک')"><span>🎵</span>موزیک</button>
            </div>

            <div class="side-label">دستیارهای تخصصی</div>
            <button class="side-item" onclick="selectCategory('shopping','فروشگاه')"><span class="si">🛍️</span>فروشگاه</button>
            <button class="side-item" onclick="selectCategory('clinic','کلینیک')"><span class="si">🏥</span>کلینیک</button>
            <button class="side-item" onclick="selectCategory('realestate','املاک')"><span class="si">🏠</span>املاک</button>
            <button class="side-item" onclick="selectCategory('education','آموزش')"><span class="si">📚</span>آموزش</button>
            <button class="side-item" onclick="selectCategory('restaurant','رستوران')"><span class="si">🍕</span>رستوران</button>
            <button class="side-item" onclick="selectCategory('legal','حقوقی')"><span class="si">⚖️</span>حقوقی</button>
            <button class="side-item" onclick="selectCategory('finance','مالی')"><span class="si">💰</span>مالی</button>
            <button class="side-item" onclick="selectCategory('support','پشتیبانی')"><span class="si">🔧</span>پشتیبانی</button>
            <button class="side-item" onclick="selectCategory('general','دستیار عمومی')"><span class="si">🤖</span>دستیار عمومی</button>

            <div class="side-label">سایر</div>
            <button class="side-item" onclick="toast('ابزارها')"><span class="si">🧰</span>ابزارها</button>
            <button class="side-item" onclick="toast('صداگذاری')"><span class="si">🎙️</span>صداگذاری و دوبله<span class="badge">جدید</span></button>
            <button class="side-item" onclick="toast('تنظیمات')"><span class="si">⚙️</span>تنظیمات</button>
        </div>
    </div>
</aside>

<div class="model-menu hidden" id="model-menu">
    <button onclick="pickModel('Gemini 3.6')">Gemini 3.6</button>
    <button onclick="pickModel('دستیار عمومی')">دستیار عمومی</button>
    <button onclick="pickModel('پشتیبانی فنی')">پشتیبانی فنی</button>
</div>
<div class="toast hidden" id="toast"></div>

<script src="/static/app.js"></script>
</body>
</html>
