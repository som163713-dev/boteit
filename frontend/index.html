<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>هوشا | دستیار هوشمند</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- صفحه اصلی -->
    <div id="home-screen" class="screen active">
        <header class="topbar">
            <div class="brand">
                <div class="brand-icon">✦</div>
                <span class="brand-name">هوشا</span>
            </div>
            <button class="chip-btn" type="button" onclick="selectCategory('general','✦ دستیار عمومی')">شروع سریع</button>
        </header>

        <main class="home-main">
            <section class="hero">
                <h1>چی می‌خوای برات انجام بدم؟</h1>
                <p>یک حوزه را انتخاب کن یا مستقیم شروع کن</p>
            </section>

            <section class="tools-section">
                <div class="section-label">حوزه‌ها</div>
                <div class="tools-grid">
                    <button class="tool-card" onclick="selectCategory('shopping','🛍️ فروشگاه')">
                        <span class="tool-icon">🛍️</span>
                        <span class="tool-name">فروشگاه</span>
                    </button>
                    <button class="tool-card" onclick="selectCategory('clinic','🏥 کلینیک')">
                        <span class="tool-icon">🏥</span>
                        <span class="tool-name">کلینیک</span>
                    </button>
                    <button class="tool-card" onclick="selectCategory('realestate','🏠 املاک')">
                        <span class="tool-icon">🏠</span>
                        <span class="tool-name">املاک</span>
                    </button>
                    <button class="tool-card" onclick="selectCategory('education','📚 آموزش')">
                        <span class="tool-icon">📚</span>
                        <span class="tool-name">آموزش</span>
                    </button>
                    <button class="tool-card" onclick="selectCategory('restaurant','🍕 رستوران')">
                        <span class="tool-icon">🍕</span>
                        <span class="tool-name">رستوران</span>
                    </button>
                    <button class="tool-card" onclick="selectCategory('legal','⚖️ حقوقی')">
                        <span class="tool-icon">⚖️</span>
                        <span class="tool-name">حقوقی</span>
                    </button>
                    <button class="tool-card" onclick="selectCategory('finance','💰 مالی')">
                        <span class="tool-icon">💰</span>
                        <span class="tool-name">مالی</span>
                    </button>
                    <button class="tool-card" onclick="selectCategory('support','🔧 پشتیبانی')">
                        <span class="tool-icon">🔧</span>
                        <span class="tool-name">پشتیبانی</span>
                    </button>
                </div>
            </section>

            <section class="quick-section">
                <div class="section-label">پیشنهادها</div>
                <div class="pills">
                    <button class="pill" onclick="quickStart('general','یک ایده کسب‌وکار بده')">💡 ایده کسب‌وکار</button>
                    <button class="pill" onclick="quickStart('clinic','علائم سرماخوردگی چیه؟')">🤒 مشاوره سریع</button>
                    <button class="pill" onclick="quickStart('education','معادله درجه دو را توضیح بده')">📖 توضیح درسی</button>
                    <button class="pill" onclick="quickStart('support','لپ‌تاپم روشن نمی‌شه')">🛠️ رفع مشکل</button>
                </div>
            </section>
        </main>
    </div>

    <!-- صفحه چت -->
    <div id="chat-screen" class="screen">
        <header class="chat-topbar">
            <button class="icon-btn" onclick="goHome()" aria-label="بازگشت">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18l6-6-6-6"/></svg>
            </button>
            <div class="chat-title-wrap">
                <span id="chat-title">چت</span>
            </div>
            <button class="icon-btn" onclick="clearChat()" aria-label="پاک کردن">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
            </button>
        </header>

        <div id="messages" class="messages-box">
            <div class="welcome-bubble">سلام! چطور می‌تونم کمکت کنم؟</div>
        </div>

        <div class="input-area">
            <div class="input-shell">
                <input id="user-input" type="text" placeholder="هرچی می‌خوای بپرس..." autocomplete="off" onkeydown="onEnter(event)" />
                <button id="send-btn" onclick="sendMessage()" aria-label="ارسال">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
